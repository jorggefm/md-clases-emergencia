<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Seis moléculas orgánicas y seis reacciones químicas en seres vivos y ecosistemas.">
  <title>2S · U7 · L1 · P02 | Reacciones de moléculas orgánicas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="presentation" aria-label="Moléculas orgánicas y transformaciones que sostienen la vida">
    <section id="stage" aria-roledescription="diapositiva" aria-label="Lámina 1 de 7">
      <img id="slide" src="assets/01-carbono-organico.png" alt="Comparación de dióxido de carbono, metano y glucosa" draggable="false">
      <div id="reaction" aria-live="polite">
        <strong id="reactionTitle"></strong>
        <div id="equation"></div>
        <div id="context"></div>
        <small id="note"></small>
      </div>
      <div id="keywords" class="overlay" hidden aria-live="polite"></div>
      <p id="idea" class="overlay" hidden aria-live="polite"></p>
      <p id="error" role="alert" hidden>No se pudo cargar esta lámina.</p>
    </section>
    <nav aria-label="Controles de presentación">
      <div class="arrows">
        <button id="prev" aria-label="Lámina anterior" title="Anterior">←</button>
        <span id="counter" aria-live="polite">1 / 7</span>
        <button id="next" aria-label="Lámina siguiente" title="Siguiente">→</button>
      </div>
      <div class="toggles">
        <button id="keyToggle" aria-controls="keywords" aria-pressed="false">Palabras clave</button>
        <button id="ideaToggle" aria-controls="idea" aria-pressed="false">Idea central</button>
        <button id="full" aria-label="Activar pantalla completa" title="Pantalla completa">⛶</button>
      </div>
    </nav>
  </main>
  <script src="slides.js"></script>
  <script src="app.js"></script>
</body>
</html>
