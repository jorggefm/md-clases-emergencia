<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Siete láminas para comprender mecanismos y patrones evolutivos con ejemplos. 4S, unidad 7, lección 2.">
  <title>Mecanismos y patrones evolutivos · 4S</title>
  <link rel="stylesheet" href="presentacion.css">
</head>
<body>
<main id="presentation" aria-label="Mecanismos y patrones evolutivos">
  <header><h1 id="title">Selección natural</h1><a href="index.html" title="Abrir las tres notas de cuaderno" aria-label="Notas de cuaderno"><i data-lucide="notebook-pen" aria-hidden="true"></i></a></header>
  <section id="stage" aria-roledescription="diapositiva" aria-label="Lámina 1 de 7" aria-busy="true">
    <img id="slide" src="laminas/01-seleccion-natural.png" alt="Pinzones con picos distintos antes y después de una sequía" draggable="false">
    <div id="keywords" class="overlay" hidden aria-live="polite"></div>
    <p id="idea" class="overlay" hidden aria-live="polite"></p>
    <div id="error" hidden role="alert"><p>No se pudo cargar la lámina.</p><button id="retry">Reintentar</button></div>
  </section>
  <nav aria-label="Controles de presentación">
    <div class="arrows"><button id="prev" aria-label="Lámina anterior" title="Anterior"><i data-lucide="chevron-left" aria-hidden="true"></i></button><span id="counter" aria-live="polite">1 / 7</span><button id="next" aria-label="Lámina siguiente" title="Siguiente"><i data-lucide="chevron-right" aria-hidden="true"></i></button></div>
    <div class="toggles"><button id="keyToggle" aria-controls="keywords" aria-pressed="false">Palabras clave</button><button id="ideaToggle" aria-controls="idea" aria-pressed="false">Idea central</button><button id="full" title="Pantalla completa" aria-label="Activar pantalla completa"><i data-lucide="maximize" aria-hidden="true"></i></button></div>
  </nav>
</main>
<script src="laminas/lucide.js"></script>
<script src="presentacion.js"></script>
</body>
</html>
